site_name: "Kubernetes & Orchestration — Ateliers Pratiques"
site_description: "Ateliers pratiques d'orchestration et déploiement de conteneurs avec Kubernetes."
site_author: "Rym Regaieg"
copyright: "Copyright &copy; 2026 Rym Regaieg"
site_url: "https://rym28.github.io/kubernetes-training/"
repo_url: "https://github.com/Rym28/kubernetes-training"
repo_name: "Rym28/kubernetes-training"

theme:
  name: material
  language: fr
  palette:
    # Mode Clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: "Passer au mode sombre"
    # Mode Sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: "Passer au mode clair"
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Architecture & Environnement:
      - Application Fil Rouge: application.md
      - Prérequis & Environnement: setup-environnement.md
  - Ateliers Pratiques:
      - Vue d'Ensemble: labs/index.md
      - "Partie 1 — Déploiement & Fondations":
          - "Atelier 01 : Provisionnement du Cluster": labs/00-provisioning-cluster.md
          - "Atelier 02 : Les Pods : les Trois Briques du Campus Summer Portal": labs/02-premiers-pods-labels.md
          - "Atelier 03 : Déploiements — Résilience & Rollback": labs/03-deployments-resilience.md
          - "Atelier 04 : Réseau, Services & Découverte DNS": labs/04-services-reseau.md
      - "Partie 2 — Production & Sécurité":
          - "Atelier 05 : Stockage & Données Persistantes": labs/05-configuration-persistance.md
          - "Atelier 06 : Exploitation & Diagnostic de Pannes": labs/06-exploitation-debugging.md
          - "Atelier 07 : Sécurité, Quotas & Isolement Réseau": labs/07-securite-quotas.md
  - Évaluation des Acquis: evaluation.md
