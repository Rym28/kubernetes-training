# Atelier 07 - Exercice 2 : ouverture des trois flux légitimes du portail.
# Flux 1 : le navigateur (via le NodePort) vers le frontend, sur son port 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-frontend
spec:
  podSelector:
    matchLabels:
      app: campus-frontend
  policyTypes:
  - Ingress
  ingress:
  - ports:                 # pas de "from" : toutes les sources, mais seulement sur ce port
    - protocol: TCP
      port: 8080
---
# Flux 2 : uniquement le frontend vers l'API backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels:
      app: campus-backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: campus-frontend
    ports:
    - protocol: TCP
      port: 8080
---
# Flux 3 : uniquement le backend vers PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-only-backend-to-postgres
spec:
  podSelector:
    matchLabels:
      app: campus-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: campus-backend
    ports:
    - protocol: TCP
      port: 5432
