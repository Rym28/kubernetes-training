# Atelier 07 - Exercice 1 : valeurs par défaut injectées dans les conteneurs
# qui ne déclarent pas de requests / limits.
apiVersion: v1
kind: LimitRange
metadata:
  name: campus-default-limits
spec:
  limits:
  - type: Container
    defaultRequest:        # valeur injectée dans resources.requests
      cpu: "100m"
      memory: "128Mi"
    default:               # valeur injectée dans resources.limits
      cpu: "500m"
      memory: "512Mi"
