# ==============================================================================
# Starter de l'Atelier 04 - API campus-backend (état de fin de l'Atelier 03)
# ------------------------------------------------------------------------------
# 3 réplicas, Rolling Update sans perte de capacité (maxUnavailable: 0),
# répartition sur les workers (podAntiAffinity).
# Identifiants de la base en clair : ils passent dans un Secret à l'Atelier 05.
# Le Service campus-backend n'est PAS fourni : vous le créez dans ce lab.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-backend
  labels:
    app: campus-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: campus-backend
  template:
    metadata:
      labels:
        app: campus-backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: campus-backend
      containers:
      - name: campus-backend
        image: regaieg/campus:backend-1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/campus"
        - name: SPRING_DATASOURCE_USERNAME
          value: "campus"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "campus"
