# ==============================================================================
# Starter de l'Atelier 06 - Frontend du Campus Summer Portal (état de fin de l'Atelier 05)
# ------------------------------------------------------------------------------
# Nginx sert le portail et relaie /api/ vers le Service campus-backend :8080.
# Exposé hors du cluster par le NodePort 30088 (30080 est réservé à Ingress NGINX).
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-frontend
  labels:
    app: campus-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-frontend
  template:
    metadata:
      labels:
        app: campus-frontend
    spec:
      containers:
      - name: campus
        image: regaieg/campus:frontend-1.0.0
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: campus-frontend-svc
spec:
  type: NodePort
  selector:
    app: campus-frontend
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30088
